[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgr"
version = "1.0.0"
description = "Reciprocal Prototype-Guided Re-ranking: training-free, label-free post-hoc re-ranking for WSI-report cross-modal retrieval."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Víctor Rodríguez-Albendea" },
    { name = "Pablo Meseguer" },
    { name = "Cristóbal Giménez" },
    { name = "Adrián Colomer Granero" },
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
scripts = ["pyyaml>=6.0", "joblib>=1.3"]
figures = ["matplotlib>=3.8", "pillow>=10.0", "tifffile>=2024.1", "weasyprint>=61.0"]

[tool.setuptools.packages.find]
where = ["src"]
